plugins {
    id 'com.android.application'
}

def vCode = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

android {
    namespace 'app.kanakku'
    compileSdk 34

    defaultConfig {
        applicationId 'app.kanakku'
        minSdk 24
        targetSdk 34
        versionCode vCode
        versionName "1.0.${vCode}"
    }

    signingConfigs {
        release {
            storeFile file('kanakku.keystore')
            storePassword System.getenv('KANAKKU_KS_PASS') ?: 'kanakku-local'
            keyAlias 'kanakku'
            keyPassword System.getenv('KANAKKU_KS_PASS') ?: 'kanakku-local'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
